services:
  - type: web
    name: academia-industry-portal
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm run render-build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: KEEP_ALIVE_ENABLED
        value: "true"
      - key: KEEP_ALIVE_INTERVAL_MINUTES
        value: "13"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
